name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Author uses the developer mailbox
        # Guards against a personal gmail identity landing in a human commit.
        # Skipped for Dependabot (its commits are authored by dependabot[bot],
        # and their contents are still gated by `npm run privacy`) and on push
        # to main, where HEAD is a merge commit authored by whoever merged.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          author=$(git log -1 --format='%ae')
          echo "HEAD author: $author"
          echo "$author" | grep -q '@marcfors.com'
          echo "$author" | grep -vi gmail
      - run: npm ci
      - run: npm run privacy
      - run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Lighthouse budgets (local build)
        run: npx --yes @lhci/cli@0.14.0 autorun
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright smoke
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
